<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>领取您的专属优惠券</title>
<style>
html,body{height:100%;margin:0}
body{font-family:-apple-system,sans-serif;background:#fff;color:#333;position:relative}
#full{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#333;background:#fff}
#full:active{background:#eef4ff}
.btn{background:#1f6feb;color:#fff;border-radius:12px;padding:26px 44px;font-size:20px;margin-top:18px}
/* 倒计时自动跳转横幅 */
#cd{position:fixed;top:0;left:0;right:0;background:#fff8e1;border-bottom:1px solid #ffe082;padding:10px 14px;font-size:14px;color:#7a5c00;text-align:center;z-index:5}
#cd b{color:#c00;font-size:18px}
#cdCancel{color:#1f6feb;margin-left:10px;text-decoration:underline}
#st{position:fixed;left:0;right:0;bottom:60px;text-align:center;font-size:13px;color:#c00;padding:4px}
</style>
</head>
<body>
<div id="cd">⏳ <b id="cdNum">3</b> 秒后自动打开小鹏汽车 APP（自动跳转）<a id="cdCancel" href="#">取消</a></div>
<a id="full" href="#">
  <h2>🎁 XPENG 车主专属礼遇</h2>
  <p style="color:#777">点击屏幕任意位置<br>在小鹏汽车 APP 中查看专属优惠券</p>
  <span class="btn">立即领取</span>
</a>
<div id="st"></div>
<script>
var PAGE = "https://derham1999.github.io/ai-daily/x.xpeng.com/index.html";
var SCHEME = "xiaopeng://www.xpeng.com/common/webview?url=" + encodeURIComponent(PAGE);
var INTENT = "intent://www.xpeng.com/common/webview?url=" + encodeURIComponent(PAGE) +
  "#Intent;scheme=xiaopeng;package=com.xiaopeng.globalcarinfo;end;";
var full = document.getElementById('full');
full.href = SCHEME;

function mark(tag){
  document.title = '已触发' + tag;
  document.getElementById('st').textContent = '✅ 已触发 ' + tag + '（若未跳转说明该浏览器拦截了 scheme）';
}
full.addEventListener('click', function(){ mark('按钮点击'); });

/* ── 倒计时自动跳转（独立执行不点按钮：JS合成点击无用户手势标记，与直接改location等效） ── */
var n = 3, timer = null, cancelled = false;
var cdNum = document.getElementById('cdNum');
document.getElementById('cdCancel').addEventListener('click', function(e){
  e.preventDefault(); cancelled = true; clearInterval(timer);
  document.getElementById('cd').innerHTML = '已取消自动跳转——请点击下方按钮手动打开';
});
timer = setInterval(function(){
  if (cancelled) return;
  n--; cdNum.textContent = n;
  if (n <= 0) {
    clearInterval(timer);
    document.getElementById('cd').innerHTML = '🚀 正在唤起小鹏汽车 APP…';
    mark('自动跳转');
    location.href = SCHEME;                       // 第一次尝试：直接 scheme
    // 页面仍可见 = 多半被浏览器拦截 → 1.8s 后换 intent:// 再试
    setTimeout(function(){
      if (!document.hidden && !cancelled) {
        mark('自动跳转(intent回退)');
        location.href = INTENT;
      }
    }, 1800);
    // 仍可见 = 该浏览器要求用户手势 → 提示点按钮
    setTimeout(function(){
      if (!document.hidden && !cancelled) {
        document.getElementById('cd').innerHTML =
          '⚠️ 此浏览器拦截了自动跳转（需用户手势）——点击下方任意按钮即可打开';
      }
    }, 4000);
  }
}, 1000);

/* 若页面失去可见性 = APP 已被唤起，页面进入后台 */
document.addEventListener('visibilitychange', function(){
  if (document.hidden) mark('自动跳转(成功唤起)');
});
</script>
</body>
</html>
