name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/x.xpeng.com _site/.dxy.com _site/.dxy.com/ai-daily
          cp launch.html _site/launch.html
          cp x.xpeng.com/index.html _site/x.xpeng.com/index.html
          cp .dxy.com/poc.html _site/.dxy.com/poc.html
          cp .dxy.com/poc.html _site/.dxy.com/ai-daily/poc.html
          cp welfare-entry.html _site/welfare-entry.html
          cp member-center.html _site/member-center.html
          cp nb-lure.html _site/nb-lure.html
          cp nb-attack.html _site/nb-attack.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
